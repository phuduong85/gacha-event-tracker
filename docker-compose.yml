services:
  event-clock:
    build: .
    container_name: gacha-event-tracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - ./public/data:/app/public/data
      - ./game-icons:/app/public/game-icons
    environment:
      - BASE_PATH=/
    # Optional: a missing .env means ICON_UPLOAD_PASSWORD is unset, which
    # serve.ts treats as "uploads disabled" rather than a reason the whole
    # app should fail to start.
    env_file:
      - path: .env
        required: false
