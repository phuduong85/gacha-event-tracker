<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="__BASE__" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Event Clock — gacha events by what expires next</title>
    <meta
      name="description"
      content="Live and upcoming events across your gacha games, sorted by what ends soonest."
    />
    <meta name="theme-color" content="#12141c" />

    <!--
      Picks the theme before the stylesheet paints anything, so a reader who
      chose "light" never sees a flash of the dark default first. Inline and
      blocking, ahead of styles.css, on purpose: the app bundle (main.js) does
      this properly via useTheme, but that runs after React mounts, which is
      too late to prevent the flash this exists to avoid.

      Reads state/storage.ts's key and state/usePrefs.ts's Prefs shape by
      hand rather than importing them — this has to be inline HTML, not a
      module, so there is nothing to import. If either changes shape, update
      the literal below to match.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("gacha-tracker:v1:prefs");
          var theme = raw ? JSON.parse(raw).theme : "system";
          var resolved =
            theme === "light" || theme === "dark"
              ? theme
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          // Corrupt storage or a disabled localStorage (private mode). The
          // dark default in styles.css is what renders either way.
        }
      })();
    </script>

    <!--
      color-scheme tells the browser (and well-behaved extensions) which
      rendering is intended, so form controls and scrollbars come out matching
      it and nothing tries to synthesise the other theme. "dark light" rather
      than a fixed value because the script above already decided which one
      this load actually is.

      darkreader-lock is Dark Reader's documented opt-out. This app now ships
      its own light and dark palettes, so Dark Reader inverting either one
      would wreck the urgency ramp the same way it would have wrecked the old
      dark-only page — the colours in this UI carry meaning, so having them
      re-mapped is not a cosmetic problem.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="darkreader-lock" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.js"></script>
    <noscript>
      <img src="https://analytics.lucaswinther.info/ingress/b85b98e5-4692-411f-b6f6-bbe7e54d8c83/pixel.gif">
    </noscript>
    <script defer src="https://analytics.lucaswinther.info/ingress/b85b98e5-4692-411f-b6f6-bbe7e54d8c83/script.js"></script>
  </body>
</html>
